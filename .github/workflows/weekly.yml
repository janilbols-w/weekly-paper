name: Collect weekly papers

on:
  schedule:
    - cron: '30 12 * * 1-5'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      weeks_back:
        description: Number of weeks to collect (use 12 for the initial backfill)
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: weekly-paper-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect and generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          args=()
          if [[ "$(TZ=Asia/Shanghai date +%u)" != "5" ]]; then
            args+=(--skip-arxiv --skip-openreview)
          fi
          python -m weekly_paper.cli \
            --reference-date "$(TZ=Asia/Shanghai date +%F)" \
            --weeks-back "${{ inputs.weeks_back || '1' }}" \
            "${args[@]}"

      - name: Build site
        run: npm run build

      - name: Commit accumulated paper data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data reports src/data src/content/docs/weekly src/content/docs/topics src/content/docs/papers public/papers.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update weekly paper briefing"
            git push
          fi
