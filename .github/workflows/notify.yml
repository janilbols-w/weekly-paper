name: Send weekly paper briefing to WeCom

on:
  schedule:
    # Fallback in case a Pages workflow_run event is delayed or unavailable.
    - cron: '0 19 * * 5'
      timezone: Asia/Shanghai
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Send again even if this weekly digest was delivered
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-paper-notification
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send existing briefing
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          args=()
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          python -m weekly_paper.notify \
            --reference-date "$(TZ=Asia/Shanghai date +%F)" \
            --latest-closed-week \
            --allow-not-ready \
            --health-check-attempts 6 \
            --health-check-interval-seconds 10 \
            "${args[@]}"

      - name: Persist delivery state
        run: |
          if [[ ! -f data/state/deliveries.json ]]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/state/deliveries.json
          if ! git diff --cached --quiet; then
            git commit -m "state: record weekly WeCom delivery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
