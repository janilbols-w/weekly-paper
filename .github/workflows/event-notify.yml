name: Send event briefing to WeCom

on:
  schedule:
    # Fallback in case a Pages workflow_run event is delayed or unavailable.
    - cron: '0 22 * * 5'
      timezone: Asia/Shanghai
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
  workflow_dispatch:
    inputs:
      event_id:
        description: Optional event id; defaults to the latest recent briefing
        required: false
        default: ''
      force:
        description: Send again even if this event digest was delivered
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-paper-event-notification
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send latest event briefing
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          args=()
          if [[ -n "$EVENT_ID" ]]; then args+=(--event "$EVENT_ID"); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          python -m weekly_paper.event_notify \
            --reference-date "$(TZ=Asia/Shanghai date +%F)" \
            --allow-not-ready \
            --health-check-attempts 12 \
            --health-check-interval-seconds 10 \
            "${args[@]}"

      - name: Persist event delivery state
        if: always() && hashFiles('data/state/event-deliveries.json') != ''
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/state/event-deliveries.json
          if ! git diff --cached --quiet; then
            git commit -m "state: record event WeCom delivery"
            bash .github/scripts/push-main.sh
          fi
