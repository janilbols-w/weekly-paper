name: Scan conference and event papers

on:
  schedule:
    - cron: '0 13 * * 5'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      event_id:
        description: Optional configured event id for a manual backfill
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: weekly-paper-events
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Scan or backfill an event
        env:
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          if [[ -n "$EVENT_ID" ]]; then
            python -m weekly_paper.event_cli --event "$EVENT_ID" --reference-date "$(TZ=Asia/Shanghai date +%F)"
          else
            python -m weekly_paper.event_cli --scan --reference-date "$(TZ=Asia/Shanghai date +%F)"
          fi
      - run: python -m unittest discover -s tests -v
      - run: npm run build
      - name: Commit event research artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events data/state/event-runs.json reports/events src/data/events.json src/content/docs/events
          if ! git diff --cached --quiet; then
            git commit -m "data: update conference event research"
            git push
          fi
