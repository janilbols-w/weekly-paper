  - id: neurips-2026
    short_name: NeurIPS 2026
    name: Conference on Neural Information Processing Systems
    domain: Machine Learning
    community: NeurIPS
    event_type: Conference
    tier: 1
    start_date: 2026-12-06
    end_date: 2026-12-13
    location: Sydney, Australia / Atlanta, United States / Paris, France
    official_url: https://neurips.cc/Conferences/2026
    program_url: https://blog.neurips.cc/2026/08/10/announcing-the-neurips-2026-workshops/
    collector: official_program
    program_source_name: NeurIPS 2026 official workshop announcement
    program_released_date: 2026-08-10
    summary_zh: NeurIPS 2026 于 8 月 10 日公布 102 个 workshop 的正式初步名单；其中高效深度学习、分布式训练、Agent 系统、端侧模型与芯片设计形成了值得持续跟踪的 AI Infra 议程簇。
    relevance_zh: 这次发布的价值在于给出了年末技术议程的结构化先验，而不是论文结论。最强信号集中在资源预算驱动的 agent、Agentic OS 抽象、跨数据中心训练、量化/稀疏/自适应推理，以及 ML 与系统、芯片的协同设计。
    current_stage_zh: 官方目前公布的是 workshop 名单与部分主办方议程。多场主题相关 workshop 的投稿截止日集中在 8 月 29 日前后，录用通知最晚为 9 月 29 日；NeurIPS 主会论文通知为 9 月 24 日。因此本次只做议程级调研，不收录或评分尚未录用的 workshop 投稿，也不把非归档 workshop 论文当作正式 proceedings。
