    summary_zh: SOSP 2026 于 9 月 9 日更新正式日程，62 篇录用论文被编入 12 个研究论文 session。与本站最相关的议程集中在多模型 serving、训练与推理仿真、RL 权重分发、确定性推理、GPU kernel 验证和 agentic kernel 优化。
    relevance_zh: 本届的强信号不只是“LLM 系统论文变多”，而是生产约束开始进入系统设计主线：多租户模型调度与显存虚拟化、跨规模性能预测、可重复推理、跨拓扑权重传输，以及用形式化约束约束自动生成 GPU kernel。报告只把官方日程视为录用证明；性能数字仍按作者论文或 artifact 中的条件化主张处理。
    key_programs:
      - {title: Model Serving at Scale, date: 2026-09-30 08:50-10:10 CEST, url: https://sigops.org/s/conferences/sosp/2026/schedule.html, focus_zh: 五篇论文覆盖生产级多模型调度、模型合并、批处理、全球服务和 GPU 能耗感知共享。}
      - {title: CXL and Memory Systems, date: 2026-09-30 13:30-15:10 CEST, url: https://sigops.org/s/conferences/sosp/2026/schedule.html, focus_zh: 聚焦 CXL 内存池、分层内存和大模型加载路径，适合观察容量解耦对 AI Infra 的影响。}
      - {title: AI Workflows and Performance Tuning, date: 2026-10-01 10:40-12:00 CEST, url: https://sigops.org/s/conferences/sosp/2026/schedule.html, focus_zh: 从数据流、性能追踪、上下文编排、自动调优到专家并行通信，覆盖生产 LLM 系统的诊断和优化闭环。}
      - {title: Predictable and Resilient AI Infrastructure, date: 2026-10-02 10:40-12:00 CEST, url: https://sigops.org/s/conferences/sosp/2026/schedule.html, focus_zh: 重点包括训练时 GPU 故障恢复、RL 权重传输、超大规模训练仿真和确定性推理。}
      - {title: GPU Kernels and Accelerators, date: 2026-10-02 15:40-17:20 CEST, url: https://sigops.org/s/conferences/sosp/2026/schedule.html, focus_zh: 覆盖 GPU 多任务、agentic kernel 优化、动态 shape kernel、CUDA kernel 验证与 wafer-scale inference runtime。}
