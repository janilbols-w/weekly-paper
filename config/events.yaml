  - id: emnlp-2026
    short_name: EMNLP 2026
    name: Conference on Empirical Methods in Natural Language Processing
    domain: LLM / NLP
    community: ACL Family
    event_type: Conference
    tier: 1
    start_date: 2026-10-24
    end_date: 2026-10-29
    location: Budapest, Hungary
    official_url: https://2026.emnlp.org/
    program_url: https://2026.emnlp.org/program/
    collector: official_program
    program_source_name: EMNLP 2026 official program and repository
    program_released_date: 2026-09-21
    briefing_title_suffix_zh: 议程更新观察
    program_link_label_zh: 官方议程
    summary_zh: EMNLP 2026 官方仓库在 9 月 21 日更新 industry track：明确 Retrieval/RAG、两场 industry keynote、Trust/Safety/Control、Agents in Production 与真实部署 panel，并把 Mohit Bansal 的 keynote 调整到 10 月 25 日 16:30。主会仍于 10 月 25 至 27 日举行，tutorial 与 workshop 安排在 10 月 28 至 29 日。
    relevance_zh: 本次新增的工程信号集中在 agent 从 benchmark 走向生产后的可靠性：长时记忆、tool/computer use、world model、价值对齐、多 agent 协调，以及真实部署中的控制、责任与评测。它与既有的 agent failure-mode tutorial、AI 审稿实验和开放语言模型 keynote 共同构成一条“诊断—修复—部署—治理”议程链，但仍属于演讲与 panel 观点，不是已核验的系统性能结论。
    current_stage_zh: 官方已公布大会日程框架、三场主会 keynote、两场 industry keynote、六场 tutorial 和 workshop 列表；9 月 21 日的变更主要补齐并重排 industry track。当前官网的 main papers 页面只有 2026 标题、没有论文条目，ACL Anthology 也尚无可核验的 EMNLP 2026 proceedings，因此本次继续保持论文覆盖与评分为 0，不推断录用规模或奖项结果。
    event_stats:
      - {label: Conference days, value: 6}
      - {label: Main conference days, value: 3}
      - {label: Tutorials, value: 6}
      - {label: Workshops, value: 28}
      - {label: Main keynotes, value: 3}
      - {label: Industry keynotes, value: 2}
    key_programs:
      - title: Preliminary Report on the AI Reviewing Experiment
        date: 2026-10-25 14:00-14:30 CEST
        location: Main conference
        url: https://2026.emnlp.org/program/
        focus_zh: 9 月 7 日新加入的独立报告环节，值得关注 AI 辅助审稿实验会公开哪些方法、失败模式与治理边界；详细材料尚未公布。
      - title: "Panel: New Missions in NLP"
        date: 2026-10-25 14:30-15:30 CEST
        location: Main conference
        url: https://2026.emnlp.org/program/
        focus_zh: 9 月 7 日由 TBD 更新为正式主题；本次按最新总议程把时间校正到 10 月 25 日下午，嘉宾与问题清单仍待公布。
      - title: "Keynote — AI for the Many: Starting from the World, Not the Model"
        date: 2026-10-27 14:00-15:00 CEST
        location: Main conference
        url: https://2026.emnlp.org/program/keynotes/
        focus_zh: Anna Korhonen 从真实世界需求、语言多样性和可用资源出发讨论 AI 研究取向；本次按最新总议程校正时间。
      - title: "Industry Keynote — Agentic Challenges: Trustworthy Collaboration, World Discovery, and Long-Horizon Memory"
        date: 2026-10-25 16:30-17:30 CEST
        location: Industry track
        url: https://2026.emnlp.org/program/industry/
        focus_zh: Mohit Bansal 聚焦 agent 的可信多 agent 协作、技能与 world model 发现、长时记忆和 tool/computer use；这是 9 月 21 日官方提交明确重排的议程，具体方法与结果仍待演讲材料核验。
      - title: "Industry Keynote — What are we aligning to? Positive Alignment for Value-based Agents"
        date: 2026-10-26 09:00-10:30 CEST
        location: Industry track
        url: https://2026.emnlp.org/program/industry/
        focus_zh: Verena Rieser 讨论 agent 在分布外情形下的价值推理、民主式原则提取与多 agent 协调失败，补充生产系统在能力之外的控制与评测边界。
      - title: "Industry Track — Agents in Production and AI Agents in the Real World"
        date: 2026-10-27 09:00-12:30 CEST
        location: Industry track
        url: https://2026.emnlp.org/program/industry/
        focus_zh: 上午连续安排 Agents in Production、oral 与真实世界 agent panel，议题覆盖可靠性、控制、责任、价值和部署条件；官方尚未公布每篇 oral 的标题与材料。
      - title: "Tutorial — Failure Modes in Agentic AI: From Reproducible Triggers and Diagnostics to Reliable Fixes"
        date: 2026-10-28 09:00-12:30 CEST
        location: Tutorials
        url: https://2026.emnlp.org/program/tutorials/
        focus_zh: 围绕 agent 失败的可复现触发、诊断和可靠修复建立系统化框架，与生产 agent 的评测、可观测性和恢复机制直接相关。
      - title: Tutorial — Tokenization for Large Language Models
        date: 2026-10-28 09:00-12:30 CEST
        location: Tutorials
        url: https://2026.emnlp.org/program/tutorials/
        focus_zh: 从 tokenizer 设计、效率与多语言公平性切入，观察 tokenization 对训练成本、上下文长度和推理吞吐的系统影响。
      - title: "BabyLM — Sample-Efficient Pretraining Workshop"
        date: 2026-10-29 09:00-17:30 CEST
        location: Workshops
        url: https://2026.emnlp.org/program/workshops/
        focus_zh: 以不超过 1 亿词等受限数据条件推动样本高效训练和可比较评测，适合跟踪小数据训练、规模律边界与低资源复现。
      - title: REALM — Workshop on Agent Language Models
        date: 2026-10-29 09:00-17:30 CEST
        location: Workshops
        url: https://2026.emnlp.org/program/workshops/
        focus_zh: 面向 agent language model 的推理、规划、工具使用、记忆、交互和评估；最终 talk 与论文清单仍以主办方后续日程为准。
