      - {label: Sydney acceptance rate, value: 21.5%}
      - {label: Paris, value: 28}
      - {label: Paris acceptance rate, value: 25.4%}
      - {label: Atlanta, value: 26}
      - {label: Atlanta acceptance rate, value: 23.6%}
    key_programs:
      - title: DiffuLM — Diffusion Language Models
        date: 2026-12-12
        location: Sydney
        url: https://7amin.github.io/diffulm-neurips2026/
        focus_zh: 聚焦并行解码、快速采样、长上下文 serving 与硬件感知系统；已公布 Stefano Ermon、Arash Vahdat、Itai Gat 等六位邀请演讲者。
      - title: On-Device Intelligence
        date: 2026-12-11/12（待定）
        location: Sydney
        url: https://odi2026.github.io/
        focus_zh: 直接面向现实资源约束下的端侧 foundation model，是能耗、内存与本地部署交叉方向的观察窗口；具体讲题尚未公布。
      - title: Machine Learning for Systems
        date: 2026-12-11/12（待定）
        location: Sydney
        url: https://mlforsystems.org/
        focus_zh: 同时讨论“用 ML 优化系统”与大模型训练、serving 的效率、可靠性和扩展性，并强调 benchmark、数据集、模拟器与可复现方法。
      - title: CODEC-FM — Collaborative, Open, and Decentralized Training
        date: 2026-12-11/12（待定）
        location: Sydney
        url: https://collaborative-open-decentralized-fomo.github.io/
        focus_zh: 覆盖跨数据中心、低带宽并行、异构设备、容错与 straggler；已公布 Peter Richtárik、Max Ryabinin、Virginia Smith 等演讲者及 keynote、poster、panel 框架。
      - title: AgenticOS
        date: 2026-12-12
        location: Sydney
        url: https://agentic-fmos.github.io/
        focus_zh: 把 agent 的内存、调度、路由、状态恢复、GPU autoscaling 和可观测性上升为 OS 层协同设计；Ion Stoica 将作 keynote，另有系统专题与 panel。
      - title: LIGHT — Lightweight Trustworthy Foundation Models
        date: 2026-12-12/13（待定）
        location: Paris
        url: https://almaai-disi-unibo.github.io/neurips2026-light-smallModels/
        focus_zh: 以蒸馏、压缩、量化、剪枝和 runtime guarantee 推动小模型真实部署；安排研究 session、panel、poster，演讲题目仍待公布。
      - title: AI for Chip Design
        date: 2026-12-12
        location: Paris
        url: https://neurips-ai-for-chip-design-2026.github.io/
        focus_zh: 连接 LLM/agent 与 HDL、EDA、验证、PPA 优化及开放 benchmark，适合跟踪 AI infra 的硬件设计闭环。
      - title: AXIOM — Foundations of Efficient Deep Learning
        date: 2026-12-12
        location: Paris
        url: https://axiom-neurips2026.github.io/
        focus_zh: 用 scaling law、优化理论解释量化、稀疏、压缩、自适应推理和内存高效训练；已公布六场 vision talk、Grand Challenges 与 panel。
      - title: Resource-Aware Agentic AI
        date: 2026-12-12/13（待定）
        location: Atlanta
        url: https://resource-aware-workshop.github.io/
        focus_zh: 把 compute、energy、memory、latency、tool cost 纳入 agent 规划、编排、上下文管理与评测；演讲者和最终日程尚未公布。
