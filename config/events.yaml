    summary_zh: ACL 2026 是年度旗舰 NLP 会议；本专题只抽取与 LLM 高效推理和 AI Infra 直接相关的论文，不把通用 NLP 论文强行纳入。
    relevance_zh: 本届在推测解码、KV Cache、结构化剪枝、Prefill-Decode 解耦与高效 RLVR 方面形成了清晰的系统化论文簇。
    key_programs:
      - title: Tutorials
        date: 2026-07-02
        url: https://2026.aclweb.org/program/tutorials/
      - title: Workshops
        date: 2026-07-03 to 2026-07-04
        url: https://2026.aclweb.org/program/workshops/
      - title: Main Conference
        date: 2026-07-05 to 2026-07-07
