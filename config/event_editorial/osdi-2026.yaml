"usenix:osdi-2026:liu-yao":
  summary_zh: ADAngel 用 DPR 模型系统生成多种 mixed-precision GEMM 策略，再针对目标模型离线穷举形成 Oracle Policy Map，由轻量 dispatcher 为运行时不同 shape/bit-width 选择 kernel。
  why_it_matters_zh: 它处理 W4A8 等 arbitrary-precision 推理中“静态 kernel 无法覆盖形状与位宽异质性”的问题；作者报告 decode 相对 llama.cpp 最高 5.10×，prefill TTFT 相对 TensorRT-LLM 提升 1.17×–2.38×。
  limitations_zh: 需要为目标模型和硬件做离线穷举与专用策略集；收益不能脱离具体 bit-width、shape、GPU/edge 平台与基线版本解释。
  selection_reason_zh: 它把低比特 GEMM 从单一 kernel 优化推进到 workload-adaptive kernel portfolio，直接对应量化部署。
  reading_depth: abstract+methods+results

"usenix:osdi-2026:li-suyi":
  summary_zh: 论文发布阿里 ASI 六个月、155,410 张多厂商多代 GPU 的生产 trace，指出不可分配空闲主要来自跨节点碎片、CPU 配比、网络 locality 与安全余量，而非 fractional-GPU 碎片。
  why_it_matters_zh: 部署的 defragmentation 使有空闲资源的节点数下降 20.2%，SpotGPU 将 GPU allocation ratio 从 68% 提升到 93%；公开 trace 也为异构调度研究提供罕见基线。
  limitations_zh: trace 不含专用集群上的大规模 foundation-model 预训练，job subtype 粒度较粗，且论文主要聚焦 GPU；结论不应直接代表所有训练集群。
  selection_reason_zh: 样本规模、异构性和公开 trace 都很突出，并明确纠正了“GPU sharing 是主要碎片来源”的常见假设。
  reading_depth: abstract+methods+results+limitations
