"usenix:osdi-2026:chaudhry":
  classification_hint: large language model serving inference latency throughput request routing autoscaling service level objective
  summary_zh: Murakkab 用声明式 agent workflow 抽象解耦逻辑、模型和硬件，再以 profile-guided optimizer 与 adaptive runtime 跨层选择模型、硬件和执行配置。
  why_it_matters_zh: 对 agent 系统而言，单次 model call 优化不够；作者在多类 workflow 上报告 GPU 用量最高降低 2.8×、能耗 3.7×、成本 4.3×，同时满足 SLO。
  limitations_zh: 收益依赖 workflow 可声明、可 profile，且需要把质量约束转化为优化器可用目标；工具调用延迟、模型漂移和未见过的 workflow 可能削弱离线 profile。
  selection_reason_zh: 它把 agent orchestration 从应用逻辑问题提升为端到端 serving 资源优化问题。
  reading_depth: abstract+methods+results

"usenix:osdi-2026:wu-haonan":
  classification_hint: inference benchmark performance profiling observability trace analysis
  summary_zh: StriaTrace 只持续跟踪关键同步点和 critical path，在异常时再加深 tracing，并用动态回归 roofline 与相关性诊断定位在线 LLM 推理的偶发 SLO 抖动。
  why_it_matters_zh: 系统已用于开发、测试和生产发布，覆盖 19 类根因；论文报告相对替代方案 tracing 开销降低 97.8%，完整方案约 1% 级开销。
  limitations_zh: 设计针对特定线上 inference stack 的同步边界与根因库；跨 serving engine、异步执行图和新硬件时需要重新定义 instrumentation 与诊断模型。
  selection_reason_zh: 它补齐了训练诊断工具难以处理的动态 batch、变长序列和瞬时 inference anomaly。
  reading_depth: abstract+methods+results+limitations

"usenix:osdi-2026:zheng":
  classification_hint: silent data corruption fault tolerance resilient distributed training GPU accelerator
  summary_zh: SDCs in the Wild 分析 23 块生产集群中的 SDC-defective GPU，发现老化、数据依赖和功能单元依赖会让设备通过常规压力测试却在真实训练输入上出错，并提出基于触发工作负载 replay 的 SDCHunter。
  why_it_matters_zh: 作者称标准行业测试漏掉超过 60% 的缺陷设备；SDCHunter 在 ByteDance 生产环境处理了 40 起 SDC 事件，为大模型集群验收和故障隔离提供了更贴近 workload 的路径。
  limitations_zh: 样本只有 23 块缺陷 GPU，来自单一生产环境；replay 依赖保留触发输入与执行条件，不能替代通用硬件健康检查，也未证明对所有 GPU 代际同样有效。
  selection_reason_zh: 这是少见的真实缺陷 GPU 样本与生产事件证据，直接影响训练集群稳定性和验收方法。
  reading_depth: abstract+methods+results

"usenix:osdi-2026:du":
  summary_zh: EcoServe 为缺少高速互联的 commodity GPU 集群设计 partially disaggregated serving：单实例内按时间解耦 prefill/decode，再让多个实例循环协作，并配合自适应路由与细粒度扩缩容。
  why_it_matters_zh: 在 32 张 L20、Ethernet 互联、30B/70B 模型上，作者报告 goodput 相对 vLLM、Sarathi、DistServe、MoonCake 提升 1.96×–2.51×，代码已公开。
  limitations_zh: 最大收益来自 L20+Ethernet 的带宽约束场景；在 H100+NVLink+InfiniBand 上只称“保持竞争力”，不同网络与模型下应重新比较 NoDG/FuDG 成本。
  code_url: https://github.com/MLSysU/EcoServe
  selection_reason_zh: 它面向大量仍在使用的普通 GPU+Ethernet 集群，并给出可复现代码和清晰硬件条件。
  reading_depth: abstract+methods+results+artifact
