"usenix:osdi-2026:luo":
  summary_zh: DirectKV 面向 Grace Hopper/Blackwell 类 CPU-GPU 一致互联平台，让 GPU kernel 直接访问 CPU-resident KV Cache，取消 GPU staging buffer，并用融合与流水隐藏 CPU 内存访问。
  why_it_matters_zh: 在 GH200 上，作者报告 CPU-GPU 传输量最高减少 50%、GPU 内存占用降低 43%、端到端性能最高提升 1.2×，直接对应长上下文容量与带宽瓶颈。
  limitations_zh: 目前主要是节点内优化；跨节点 context parallel、多级存储层和 host-memory pressure 仍需额外 runtime 支持，退化到 pageable 或磁盘层后 zero-copy 优势会减弱。
  selection_reason_zh: 这是面向 NVLink-C2C 异构内存的明确系统路径，硬件前提与边界清楚。
  reading_depth: abstract+methods+results+limitations

"usenix:osdi-2026:zhang-dingyan":
  summary_zh: LMetric 用“新 prefill token 数 × 当前 batch size”这一乘法分数同时表达 KV Cache 亲和性与负载均衡，避免线性组合的 workload-specific 调参和模拟器依赖。
  why_it_matters_zh: 作者在聊天与 coding-agent 生产流量上报告，相对 vLLM-v1 和生产调度器，TTFT 分别最高降低 92% 和 39%，TPOT 最高降低 24% 和 51%，并已 canary 部署。
  limitations_zh: 结果依赖论文选择的两个指标、模型和 trace；作者虽给出乘法失效条件与检测方法，但跨引擎、跨缓存策略和强突发流量仍需复现。
  selection_reason_zh: 方法极简、无需超参，并有生产 canary，是请求路由与缓存感知调度中很实用的基线。
  reading_depth: abstract+methods+results

"usenix:osdi-2026:yu-shan":
  summary_zh: Prism 用 GPU memory ballooning 在多模型之间统一空间共享和时间共享；其 kvcached 驱动作为 inference engine 与 GPU 内存之间的 shim，按流量变化回收和重新分配显存。
  why_it_matters_zh: kvcached 已开源并部署到 10K+ GPU；论文报告在同等 GPU 数下 SLO 达标率显著提升，在同等 SLO 下成本最高降低超过 2×。
  limitations_zh: 核心假设是生产流量存在动态 bursty-group；接入需要 engine/runtime 与显存回收语义配合，隔离、抖动和不同模型内存布局下的收益需实测。
  code_url: https://github.com/ovg-project/kvcached
  selection_reason_zh: 多模型低流量常驻是推理平台的真实成本问题，Prism 同时具备 10K+ GPU 部署与可检查代码。
  reading_depth: abstract+methods+results+artifact

"usenix:osdi-2026:hu-weifang":
  classification_hint: distributed training checkpointing pipeline parallel large model training
  summary_zh: Tessera 面向异构 MoE/attention block 的超大模型训练，联合优化 pipeline partition 与 compute-communication overlap，并在运行时用 dynamic bubble optimizer 填补 MoE 路由造成的瞬时空洞。
  why_it_matters_zh: 系统用于 Qwen3 与 Qwen3-Next 生产预训练；在 4,096–12,288 GPU 的五个工作负载上，作者报告吞吐提升 20%–33%，万亿参数模型达到 39% MFU。
  limitations_zh: 主要证据来自阿里生产栈和特定 Qwen 异构结构；与 Megatron-Core 的公开对照规模和生产基线并不完全相同，迁移到其他模型/互联需重新 profile。
  selection_reason_zh: 它给出了万卡级异构 MoE pipeline 的生产证据，覆盖静态分区与动态路由两类气泡来源。
  reading_depth: abstract+methods+results

"usenix:osdi-2026:chen-luofan":
  summary_zh: 这篇 Best Paper 从大规模预训练生产 trace 提炼出跨数据中心 checkpoint、启动加载 I/O 风暴和多模态数据变换三个瓶颈，并分别采用预测复制、hot-file 预复制与存储侧 CPU offload。
  why_it_matters_zh: 作者报告单次评估浪费的 GPU-hours 从 16,800 降至 4,000、启动 checkpoint 加载缩短 40.8%、dataloading stall 降低 63.2%，说明“旧存储系统”可通过接口协同获得高回报。
  limitations_zh: 方案依赖训练框架提前暴露 world size、文件热度和访问计划；生产数字来自特定存储拓扑与训练流程，复制成本和跨团队改造量需单独核算。
  selection_reason_zh: 获 Jay Lepreau Best Paper，且把训练数据管线的生产瓶颈、机制和 GPU-hour 收益连成了完整证据链。
  reading_depth: abstract+methods+results
