"usenix:osdi-2026:xie-zhiqiang":
  summary_zh: Strata 把长上下文 KV Cache 的 GPU HBM、CPU 内存和 SSD 多级缓存作为统一系统处理，用 GPU-assisted I/O 合并碎片化小传输，并让调度器显式感知缓存加载时延与 delay hit。
  why_it_matters_zh: 它已集成 SGLang 并进入生产；作者在指定长上下文模型和工作负载上报告吞吐最高为 vLLM-LMCache 的 5×、TensorRT-LLM 的 3.75×，同时保持短上下文性能。
  limitations_zh: GPU-assisted I/O 会占用少量 SM；收益依赖缓存命中、页布局、CPU-GPU 互联和长上下文比例，峰值加速不能直接外推到任意在线流量。
  selection_reason_zh: 长上下文 serving 的关键瓶颈已从单纯显存容量转向跨层 I/O 与调度协同，且有 SGLang 和生产部署证据。
  reading_depth: abstract+methods+results+limitations
